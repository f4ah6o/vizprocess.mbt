<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vizprocess.mbt — browser demo</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        max-width: 760px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #222;
      }
      h1 {
        margin-bottom: 0.25rem;
      }
      p {
        color: #555;
      }
      textarea {
        width: 100%;
        min-height: 220px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        padding: 0.5rem;
        box-sizing: border-box;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.5rem 1rem;
        font-size: 14px;
        cursor: pointer;
      }
      #output {
        margin-top: 1rem;
        border: 1px solid #ccc;
        padding: 1rem;
        background: #fff;
      }
      pre {
        background: #f4f4f4;
        padding: 0.5rem;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>vizprocess.mbt</h1>
    <p>
      The
      <code>packages/wasm</code>
      module is built for the
      <code>js</code>
      target and imported as a plain ES module. The JS-side prefetch
      resolves
      <code>csv-file</code>
      sources via
      <code>fetch</code>
      and
      <code>duckdb</code>
      sources via DuckDB-Wasm (lazy-loaded from jsDelivr) before
      calling
      <code>manifest_to_svg</code>
      .
    </p>
    <p>
      <button id="example-csv">csv-file example</button>
      <button id="example-duckdb">duckdb example</button>
    </p>
    <textarea id="manifest"></textarea>
    <button id="run">Render</button>
    <h2>SVG</h2>
    <div id="output"></div>
    <h2>Source</h2>
    <pre id="raw"></pre>
    <h2>Status</h2>
    <pre id="status"></pre>

    <script type="module">
      import { manifest_to_svg } from "../../_build/js/release/build/wasm/wasm.js";
      import {
        prefetchManifestSources,
        browserReader,
      } from "./prefetch.mjs";
      import {
        getDuckDbConnection,
        duckdbQueryToCsv,
      } from "./duckdb-loader.mjs";

      const csvFileManifest = {
        id: "monthly-sales",
        datasets: [
          {
            id: "monthly_sales",
            source: {
              kind: "csv-file",
              path: "../../fixtures/datasets/sales.csv",
              schema: {
                fields: [
                  { name: "month", dtype: "string" },
                  { name: "region", dtype: "string" },
                  { name: "amount", dtype: "int" },
                ],
              },
            },
            pipeline: {
              steps: [
                {
                  type: "filter",
                  field: "region",
                  op: "eq",
                  value: { dtype: "string", v: "JP" },
                },
                {
                  type: "aggregate",
                  group_by: ["month"],
                  measures: [
                    { field: "amount", op: "sum", as: "total" },
                  ],
                },
              ],
            },
          },
        ],
        charts: [
          {
            id: "sales-bar",
            dataset_id: "monthly_sales",
            spec: {
              id: "sales-bar",
              mark: "bar",
              encoding: {
                x: { field: "month" },
                y: { field: "total" },
              },
              config: { width: 480, height: 240 },
            },
          },
        ],
        artifacts: [
          { id: "svg", kind: "svg", chart_id: "sales-bar" },
        ],
      };

      const duckdbManifest = {
        ...csvFileManifest,
        id: "monthly-sales-duckdb",
        datasets: [
          {
            id: "monthly_sales",
            source: {
              kind: "duckdb",
              db: ":memory:",
              // Inline VALUES so DuckDB-Wasm's virtual filesystem isn't
              // involved. Run the same aggregation the csv-file example
              // does; the result is fed back through csv-inline.
              sql:
                "SELECT month, SUM(amount)::INT AS total FROM (VALUES " +
                "('2026-01','JP',100),('2026-01','US',50)," +
                "('2026-02','JP',200),('2026-02','US',150)," +
                "('2026-01','JP',75)" +
                ") AS t(month, region, amount) " +
                "WHERE region = 'JP' GROUP BY month ORDER BY month",
              schema: {
                fields: [
                  { name: "month", dtype: "string" },
                  { name: "total", dtype: "int" },
                ],
              },
            },
            // SQL already produced the final shape; no extra steps.
            pipeline: { steps: [] },
          },
        ],
      };

      const manifestEl = document.getElementById("manifest");
      const outputEl = document.getElementById("output");
      const rawEl = document.getElementById("raw");
      const statusEl = document.getElementById("status");
      const runBtn = document.getElementById("run");

      manifestEl.value = JSON.stringify(csvFileManifest, null, 2);

      const csvReader = browserReader(import.meta.url);
      const duckdbRunner = async (db, sql, schema) => {
        const { conn } = await getDuckDbConnection();
        return duckdbQueryToCsv(conn, sql, schema);
      };

      async function render() {
        statusEl.textContent = "resolving sources…";
        try {
          const original = JSON.parse(manifestEl.value);
          const resolved = await prefetchManifestSources(original, {
            csvReader,
            duckdbRunner,
          });
          const svg = manifest_to_svg(JSON.stringify(resolved));
          outputEl.innerHTML = svg;
          rawEl.textContent = svg;
          statusEl.textContent = "ok";
        } catch (err) {
          statusEl.textContent = "error: " + (err?.message ?? err);
        }
      }

      runBtn.addEventListener("click", render);
      document
        .getElementById("example-csv")
        .addEventListener("click", () => {
          manifestEl.value = JSON.stringify(csvFileManifest, null, 2);
        });
      document
        .getElementById("example-duckdb")
        .addEventListener("click", () => {
          manifestEl.value = JSON.stringify(duckdbManifest, null, 2);
        });
      render();
    </script>
  </body>
</html>
