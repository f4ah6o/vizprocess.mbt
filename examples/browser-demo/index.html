<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vizprocess.mbt — browser demo</title>
    <style>
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        max-width: 760px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #222;
      }
      h1 {
        margin-bottom: 0.25rem;
      }
      p {
        color: #555;
      }
      textarea {
        width: 100%;
        min-height: 320px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        padding: 0.5rem;
        box-sizing: border-box;
      }
      button {
        margin-top: 0.5rem;
        padding: 0.5rem 1rem;
        font-size: 14px;
        cursor: pointer;
      }
      #output {
        margin-top: 1rem;
        border: 1px solid #ccc;
        padding: 1rem;
        background: #fff;
      }
      pre {
        background: #f4f4f4;
        padding: 0.5rem;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <h1>vizprocess.mbt</h1>
    <p>
      The
      <code>packages/wasm</code>
      module is built for the
      <code>js</code>
      target and imported as a plain ES module. Edit the manifest below
      and click
      <strong>Render</strong>
      to call
      <code>manifest_to_svg</code>
      directly from the page. M7.5 supports
      <code>csv-inline</code>
      sources only.
    </p>
    <textarea id="manifest"></textarea>
    <button id="run">Render</button>
    <h2>SVG</h2>
    <div id="output"></div>
    <h2>Source</h2>
    <pre id="raw"></pre>

    <script type="module">
      import { manifest_to_svg } from "../../_build/js/release/build/wasm/wasm.js";

      const defaultManifest = {
        id: "monthly-sales",
        datasets: [
          {
            id: "monthly_sales",
            source: {
              kind: "csv-inline",
              data:
                "month,region,amount\n" +
                "2026-01,JP,100\n" +
                "2026-01,US,50\n" +
                "2026-02,JP,200\n" +
                "2026-02,US,150\n" +
                "2026-01,JP,75\n",
              schema: {
                fields: [
                  { name: "month", dtype: "string" },
                  { name: "region", dtype: "string" },
                  { name: "amount", dtype: "int" },
                ],
              },
            },
            pipeline: {
              steps: [
                {
                  type: "filter",
                  field: "region",
                  op: "eq",
                  value: { dtype: "string", v: "JP" },
                },
                {
                  type: "aggregate",
                  group_by: ["month"],
                  measures: [
                    { field: "amount", op: "sum", as: "total" },
                  ],
                },
              ],
            },
          },
        ],
        charts: [
          {
            id: "sales-bar",
            dataset_id: "monthly_sales",
            spec: {
              id: "sales-bar",
              mark: "bar",
              encoding: {
                x: { field: "month" },
                y: { field: "total" },
              },
              config: { width: 480, height: 240 },
            },
          },
        ],
        artifacts: [
          { id: "svg", kind: "svg", chart_id: "sales-bar" },
        ],
      };

      const manifestEl = document.getElementById("manifest");
      const outputEl = document.getElementById("output");
      const rawEl = document.getElementById("raw");
      const runBtn = document.getElementById("run");

      manifestEl.value = JSON.stringify(defaultManifest, null, 2);

      function render() {
        const svg = manifest_to_svg(manifestEl.value);
        outputEl.innerHTML = svg;
        rawEl.textContent = svg;
      }

      runBtn.addEventListener("click", render);
      render();
    </script>
  </body>
</html>
