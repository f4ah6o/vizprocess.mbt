name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install DuckDB (macOS)
        if: runner.os == 'macOS'
        run: brew install duckdb

      - name: Install DuckDB (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip
          curl -fsSL -o /tmp/libduckdb-linux-amd64.zip \
            https://github.com/duckdb/duckdb/releases/latest/download/libduckdb-linux-amd64.zip
          unzip -o /tmp/libduckdb-linux-amd64.zip -d /tmp/libduckdb
          sudo cp /tmp/libduckdb/libduckdb.so /usr/local/lib/
          sudo cp /tmp/libduckdb/duckdb.h /usr/local/include/
          sudo ldconfig

      - name: Moon version
        run: moon version --all

      - name: Update Moon registry
        run: moon update

      - name: Format check
        run: moon fmt --check

      - name: Check native
        run: moon check --target native

      - name: Test native
        run: moon test --target native

      - name: Check wasm-gc (libs + wasm bridge)
        run: moon check --target wasm-gc

      - name: Build wasm-gc bridge
        run: moon build --target wasm-gc

      - name: Build js bridge (release)
        run: moon build --target js --release

      - name: Smoke test js bridge from Node
        run: |
          out=$(node examples/browser-demo/node-smoke.mjs)
          expected=$(cat fixtures/expected/sales-bar.svg)
          test "$out" = "$expected"

      - name: Smoke test duckdb prefetch path from Node (mock runner)
        run: node examples/browser-demo/duckdb-prefetch-smoke.mjs
